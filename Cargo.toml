[package]
name = "schemafix-rs"
version = "0.1.0"
edition = "2024"
description = "Validate, repair and correct LLM structured output against a JSON Schema"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "schemafix"
path = "src/lib.rs"

[[bin]]
name = "schemafix"
path = "src/bin/schemafix.rs"

[dependencies]
jsonrepair-rs = "0.2.7"
jsonschema = { version = "0.63.1", default-features = false }
schemars = { version = "1.2.3", optional = true }
serde = { version = "1.0.229", optional = true }
serde_json = "1.0.154"

[features]
schemars = ["dep:schemars", "dep:serde"]

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
