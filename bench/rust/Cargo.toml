[package]
name = "schemafix-bench"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
schemafix-rs = { path = "../.." }
jsonrepair-rs = "0.2.7"
jsonschema = { version = "0.63.1", default-features = false }
rstructor = { version = "0.6.0", default-features = false, features = ["derive", "mock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["rt"] }

[workspace]

[profile.release]
debug = false
